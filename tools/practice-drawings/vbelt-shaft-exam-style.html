<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>V벨트 전동장치 축 연습 도면(기능사 양식)</title>
<!--
  vbelt-exam-problem-sheet.html 문제지의 품번 2 축을 기능사 양식(3각법, 표제란·부품표, 주서, 끼워맞춤,
  기하공차, 표면 거칠기 기호, 양 끝이 둥근 키홈과 단면도)으로 새로 그린 가상 연습 도면이에요.
  ?variant=challenge 이면 의도한 틀린 곳 4개가 들어가요(정답은 docs/copilot-studio/examples/vbelt-shaft-exam-style-answer-key.md).
  PDF는 tools/make_exam_style_drawings.py 로 만들어요.
-->
<style>
  @page { size: 420mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  svg { display: block; width: 420mm; height: 297mm; }
  text { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; fill: #000; }
</style>
</head>
<body>
<svg id="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297"></svg>
<script>
const challenge = new URLSearchParams(location.search).get("variant") === "challenge";

// 의도한 틀린 곳(비교 도면만): 몸통 길이 치수, 풀리 자리 끼워맞춤, 단면 키홈 폭, 오일실 자리 거칠기 기호 빠짐, 키홈 깊이, 원주 흔들림 공차 빠짐
const BODY_LENGTH_TEXT = challenge ? "42" : "44";
const PULLEY_FIT = challenge ? "Ø14k6" : "Ø14h6";
const SECTION_KEY_WIDTH = challenge ? "6" : "5";
const SEAL_ROUGHNESS = !challenge;
const KEY_DEPTH_TEXT = challenge ? "12" : "11";
const RUNOUT_FRAME = !challenge;

const svg = document.getElementById("sheet");
const NS = "http://www.w3.org/2000/svg";
function add(tag, attrs, text) {
  const node = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  svg.appendChild(node);
  return node;
}
const THICK = 0.5, THIN = 0.25;
const line = (x1, y1, x2, y2, width = THIN, extra = {}) => add("line", { x1, y1, x2, y2, stroke: "#000", "stroke-width": width, ...extra });
const text = (x, y, value, size = 3.5, extra = {}) => add("text", { x, y, "font-size": size, ...extra }, value);
const centerLine = (x1, y1, x2, y2) => line(x1, y1, x2, y2, 0.18, { "stroke-dasharray": "6 1.5 1 1.5" });
function arrow(x, y, direction) {
  const length = 2.5, half = 0.45;
  const bx = x - length * Math.cos(direction), by = y - length * Math.sin(direction);
  const nx = -Math.sin(direction) * half, ny = Math.cos(direction) * half;
  add("path", { d: `M${x} ${y} L${bx + nx} ${by + ny} L${bx - nx} ${by - ny} Z`, fill: "#000" });
}
function horizontalDimension(x1, x2, y, value) {
  line(x1, y, x2, y);
  arrow(x1, y, Math.PI);
  arrow(x2, y, 0);
  text((x1 + x2) / 2, y - 1, value, 3.5, { "text-anchor": "middle" });
}
function verticalDimension(x, y1, y2, value) {
  line(x, y1, x, y2);
  arrow(x, y1, -Math.PI / 2);
  arrow(x, y2, Math.PI / 2);
  const middle = (y1 + y2) / 2;
  text(x - 1, middle, value, 3.5, { "text-anchor": "middle", transform: `rotate(-90 ${x - 1} ${middle})` });
}
function roughness(x, y, letter) {
  add("polyline", { points: `${x - 1.6},${y - 1.6} ${x},${y} ${x + 3.2},${y - 5.5} ${x + 6},${y - 5.5}`, fill: "none", stroke: "#000", "stroke-width": THIN });
  text(x + 3.6, y - 6.2, letter, 3);
}

add("rect", { x: 10, y: 10, width: 400, height: 277, fill: "none", stroke: "#000", "stroke-width": 0.7 });
line(210, 5, 210, 10, 0.5); line(210, 287, 210, 292, 0.5); line(5, 148.5, 10, 148.5, 0.5); line(410, 148.5, 415, 148.5, 0.5);

// ── 정면도: 축(품번 2) ──────────────────────────────────────────────
const AXIS = 120;
// [지름, 길이, 지름 치수 글자, 길이 치수 글자]
const SEGMENTS = [
  [17, 13, "Ø17k6", "13"],
  [22, 44, "Ø22", BODY_LENGTH_TEXT],
  [17, 13, "Ø17k6", "13"],
  [16, 15, "Ø16", "15"],
  [14, 24, PULLEY_FIT, "24"],
  [12, 14, "M12", "14"],
];
const START = 50;
const edges = [START];
for (const [, length] of SEGMENTS) edges.push(edges.at(-1) + length);
const END = edges.at(-1);
const C = 1;

function profile(sign) {
  const points = [[START, AXIS + sign * (SEGMENTS[0][0] / 2 - C)], [START + C, AXIS + sign * SEGMENTS[0][0] / 2]];
  SEGMENTS.forEach(([diameter], index) => {
    const r = diameter / 2;
    if (index > 0) points.push([edges[index], AXIS + sign * r]);
    const last = index === SEGMENTS.length - 1;
    points.push([last ? END - C : edges[index + 1], AXIS + sign * r]);
  });
  points.push([END, AXIS + sign * (SEGMENTS.at(-1)[0] / 2 - C)]);
  add("polyline", { points: points.map((p) => p.join(",")).join(" "), fill: "none", stroke: "#000", "stroke-width": THICK });
  // 나사 골지름(가는 실선)
  line(edges[5] + 1, AXIS + sign * 5.1, END - C, AXIS + sign * 5.1, 0.18);
}
profile(-1);
profile(1);
line(START, AXIS - (SEGMENTS[0][0] / 2 - C), START, AXIS + (SEGMENTS[0][0] / 2 - C), THICK);
line(END, AXIS - (SEGMENTS.at(-1)[0] / 2 - C), END, AXIS + (SEGMENTS.at(-1)[0] / 2 - C), THICK);
line(START + C, AXIS - SEGMENTS[0][0] / 2, START + C, AXIS + SEGMENTS[0][0] / 2, THIN);
line(END - C, AXIS - SEGMENTS.at(-1)[0] / 2, END - C, AXIS + SEGMENTS.at(-1)[0] / 2, THIN);
for (let index = 1; index < SEGMENTS.length; index += 1) {
  const r = Math.max(SEGMENTS[index - 1][0], SEGMENTS[index][0]) / 2;
  line(edges[index], AXIS - r, edges[index], AXIS + r, THICK);
}
centerLine(START - 6, AXIS, END + 6, AXIS);

// 키홈(엔드밀 가공, 양 끝 반원): 폭 5, 길이 14, 풀리 자리 왼쪽 끝에서 8
const KEY_W = 5, KEY_L = 14, KEY_FROM = 8;
const keyX0 = edges[4] + KEY_FROM, keyX1 = keyX0 + KEY_L, keyR = KEY_W / 2;
add("path", {
  d: `M${keyX0 + keyR} ${AXIS - keyR} L${keyX1 - keyR} ${AXIS - keyR} A${keyR} ${keyR} 0 0 1 ${keyX1 - keyR} ${AXIS + keyR} L${keyX0 + keyR} ${AXIS + keyR} A${keyR} ${keyR} 0 0 1 ${keyX0 + keyR} ${AXIS - keyR} Z`,
  fill: "none", stroke: "#000", "stroke-width": THICK,
});
const topY = AXIS - 24;
line(edges[4], AXIS - 8 - 1, edges[4], topY - 2);
line(keyX0, AXIS - keyR - 1, keyX0, topY - 2);
line(keyX1, AXIS - keyR - 1, keyX1, topY - 2);
horizontalDimension(edges[4], keyX0, topY, String(KEY_FROM));
horizontalDimension(keyX0, keyX1, topY, String(KEY_L));

// 절단선 A-A
const cutX = keyX0 + 4;
line(cutX, AXIS - 13, cutX, AXIS - 9, 0.5);
line(cutX, AXIS + 9, cutX, AXIS + 13, 0.5);
line(cutX, AXIS - 13, cutX + 4, AXIS - 13, THIN); arrow(cutX + 4, AXIS - 13, 0);
line(cutX, AXIS + 13, cutX + 4, AXIS + 13, THIN); arrow(cutX + 4, AXIS + 13, 0);
text(cutX + 5, AXIS - 12, "A", 3.5);
text(cutX + 5, AXIS + 14.2, "A", 3.5);

// 지름 치수(세로)
const diameterX = [];
SEGMENTS.forEach(([diameter, , label], index) => {
  let x = (edges[index] + edges[index + 1]) / 2;
  if (index === 4) x = edges[4] + 4.5; // 키홈과 겹치지 않게
  diameterX.push(x);
  verticalDimension(x, AXIS - diameter / 2, AXIS + diameter / 2, label);
});

// 데이텀 A·B(두 베어링 자리)
function datum(x, y, name) {
  add("path", { d: `M${x - 1.6} ${y} L${x + 1.6} ${y} L${x} ${y + 2.6} Z`, fill: "#000" });
  line(x, y, x, y - 4);
  add("rect", { x: x - 2.5, y: y - 9, width: 5, height: 5, fill: "none", stroke: "#000", "stroke-width": THIN });
  text(x, y - 5.3, name, 3.5, { "text-anchor": "middle" });
}
datum(diameterX[0] + 3.5, AXIS - 8.5 - 3, "A");
line(diameterX[0] + 3.5, AXIS - 11.5, diameterX[0] + 3.5, AXIS - 8.5, THIN);
datum(diameterX[2] + 3.5, AXIS - 8.5 - 3, "B");
line(diameterX[2] + 3.5, AXIS - 11.5, diameterX[2] + 3.5, AXIS - 8.5, THIN);

// 기하공차: 풀리 자리 원주 흔들림(치수선과 겹치지 않게 전체 길이 아래에 둠)
function runout(x, fromY, value) {
  const fy = AXIS + 51;
  line(x + 6, fromY, x + 6, fy - 5, THIN); arrow(x + 6, fromY, -Math.PI / 2);
  add("rect", { x, y: fy - 5, width: 28, height: 5, fill: "none", stroke: "#000", "stroke-width": THIN });
  line(x + 6, fy - 5, x + 6, fy, THIN);
  line(x + 18, fy - 5, x + 18, fy, THIN);
  line(x + 1.5, fy - 1, x + 4.5, fy - 4, THIN); arrow(x + 4.5, fy - 4, -Math.PI / 4);
  text(x + 7, fy - 1.2, value, 3.2);
  text(x + 19, fy - 1.2, "A-B", 3.2);
}
if (RUNOUT_FRAME) runout(edges[4] + 2, AXIS + 7, "0.011");

// 길이 치수: 직렬 치수 + 전체 길이
const chainY = AXIS + 30, overallY = AXIS + 40;
for (const [index, x] of edges.entries()) {
  const r = index === 0 ? SEGMENTS[0][0] / 2 : index === SEGMENTS.length ? SEGMENTS.at(-1)[0] / 2 : Math.max(SEGMENTS[index - 1][0], SEGMENTS[index][0]) / 2;
  line(x, AXIS + r + 1, x, (index === 0 || index === SEGMENTS.length ? overallY : chainY) + 2);
}
SEGMENTS.forEach(([, , , label], index) => horizontalDimension(edges[index], edges[index + 1], chainY, label));
horizontalDimension(START, END, overallY, "123");

// 표면 거칠기 기호
roughness(diameterX[0] - 4, AXIS - 8.5, "y");
roughness(diameterX[2] - 4, AXIS - 8.5, "y");
if (SEAL_ROUGHNESS) roughness(diameterX[3] + 1.5, AXIS - 8, "y");
roughness(edges[4] + 15, AXIS - 7, "x");

// 품번
add("circle", { cx: START - 4, cy: AXIS - 34, r: 4, fill: "none", stroke: "#000", "stroke-width": THIN });
text(START - 4, AXIS - 32.8, "2", 3.5, { "text-anchor": "middle" });
roughness(START + 4, AXIS - 32, "w");
text(START + 12, AXIS - 33, "( x  y )", 3.2);

// ── 단면 A-A ─────────────────────────────────────────────────────
{
  const cx = 245, cy = AXIS, r = 7, half = KEY_W / 2, depth = 3;
  const top = cy - Math.sqrt(r * r - half * half);
  const bottomKey = cy - r + depth;
  add("path", {
    d: `M${cx + half} ${top} A${r} ${r} 0 1 1 ${cx - half} ${top} L${cx - half} ${bottomKey} L${cx + half} ${bottomKey} Z`,
    fill: "none", stroke: "#000", "stroke-width": THICK,
  });
  const clip = add("clipPath", { id: "section-clip" });
  const shape = document.createElementNS(NS, "path");
  shape.setAttribute("d", `M${cx + half} ${top} A${r} ${r} 0 1 1 ${cx - half} ${top} L${cx - half} ${bottomKey} L${cx + half} ${bottomKey} Z`);
  clip.appendChild(shape);
  for (let offset = -16; offset <= 16; offset += 2) {
    line(cx + offset - 8, cy + 8, cx + offset + 8, cy - 8, 0.18, { "clip-path": "url(#section-clip)" });
  }
  centerLine(cx - 11, cy, cx + 11, cy);
  centerLine(cx, cy - 11, cx, cy + 11);
  const keyDimY = cy - r - 6;
  line(cx - half, top - 1, cx - half, keyDimY - 2);
  line(cx + half, top - 1, cx + half, keyDimY - 2);
  line(cx - half - 6, keyDimY, cx - half, keyDimY); arrow(cx - half, keyDimY, 0);
  line(cx + half, keyDimY, cx + half + 6, keyDimY); arrow(cx + half, keyDimY, Math.PI);
  text(cx + half + 1, keyDimY - 1, `${SECTION_KEY_WIDTH}N9`, 3.5);
  const sideX = cx + r + 7;
  line(cx + half + 1, bottomKey, sideX + 2, bottomKey);
  line(cx + 1, cy + r, sideX + 2, cy + r);
  line(sideX, bottomKey, sideX, cy + r);
  arrow(sideX, bottomKey, -Math.PI / 2);
  arrow(sideX, cy + r, Math.PI / 2);
  const middle = (bottomKey + cy + r) / 2;
  text(sideX - 1, middle, KEY_DEPTH_TEXT, 3.5, { "text-anchor": "middle", transform: `rotate(-90 ${sideX - 1} ${middle})` });
  text(cx, cy + r + 10, "A-A", 4, { "text-anchor": "middle" });
}

// ── 주서 ─────────────────────────────────────────────────────────
{
  const x = 22, y = 200, gap = 5.5;
  [
    "주서",
    "1. 일반 공차: KS B ISO 2768-m",
    "2. 도시되고 지시 없는 모따기는 C1, 필렛은 R1",
    "3. 일반 모따기는 0.2×45°",
    "4. 키홈은 엔드밀 가공(양 끝 반원)",
    "5. 표면 거칠기:  w = Ra 12.5,  x = Ra 3.2,  y = Ra 0.8",
    "※ 가상 연습 도면(실제 기출 도면 아님)",
  ].forEach((note, index) => text(x, y + index * gap, note, index === 0 ? 4 : 3.2));
}

// ── 부품표·표제란(오른쪽 아래) ─────────────────────────────────────
{
  const x0 = 250, x1 = 410, rowH = 7;
  const cols = [x0, 262, 300, 335, 350, x1];
  const partY = 222;
  [
    ["2", "축", "SM45C", "1", ""],
    ["품번", "품 명", "재 질", "수량", "비 고"],
  ].forEach((cells, rowIndex) => {
    const top = partY + rowIndex * rowH;
    add("rect", { x: x0, y: top, width: x1 - x0, height: rowH, fill: "none", stroke: "#000", "stroke-width": THIN });
    cells.forEach((cell, index) => {
      if (index > 0) line(cols[index], top, cols[index], top + rowH, THIN);
      if (cell) text((cols[index] + cols[index + 1]) / 2, top + 5, cell, 3.2, { "text-anchor": "middle" });
    });
  });
  const titleY = partY + 2 * rowH;
  add("rect", { x: x0, y: titleY, width: x1 - x0, height: 287 - titleY, fill: "none", stroke: "#000", "stroke-width": 0.5 });
  line(x0 + 40, titleY, x0 + 40, 287, THIN);
  line(x0, titleY + 12, x1, titleY + 12, THIN);
  line(x0 + 110, titleY + 12, x0 + 110, 287, THIN);
  text(x0 + 20, titleY + 7.5, "작 품 명", 3.5, { "text-anchor": "middle" });
  text(x0 + 100, titleY + 8, "V벨트 전동장치 축(기능사 양식)", 4.5, { "text-anchor": "middle" });
  text(x0 + 20, titleY + 22, "척 도", 3.5, { "text-anchor": "middle" });
  text(x0 + 75, titleY + 22, "1:1", 3.5, { "text-anchor": "middle" });
  text(x0 + 135, titleY + 22, "3각법", 3.5, { "text-anchor": "middle" });
}
</script>
</body>
</html>
